name: 🍏 HearEng iOS Cloud Mac Auto Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: 🛠️ Build iOS App on Cloud Mac
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install NPM Dependencies
        run: |
          npm install

      - name: 4. Sync Web Assets & Datasets to iOS Platform
        run: |
          python sync_dev_assets.py
          npx cap sync ios

      - name: 5. Build Xcode iOS Project (Cloud Mac)
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 6. Package iOS App
        run: |
          mkdir -p build/Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build
          zip -r HearEng_v2.16_iOS_App.ipa Payload
          zip -r HearEng_v2.16_iOS_Simulator.zip Payload/App.app

      - name: 7. Upload Compiled iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HearEng_v2.16_iOS_Build_Artifacts
          path: |
            build/HearEng_v2.16_iOS_App.ipa
            build/HearEng_v2.16_iOS_Simulator.zip
          retention-days: 30

<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Audio Player - Slate Grey</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#bdc8d3",
                        "outline-variant": "#44474b",
                        "on-primary": "#28313b",
                        "surface-tint": "#bdc8d3",
                        "on-surface": "#dae2fd",
                        "surface-container-lowest": "#060e20",
                        "on-surface-variant": "#c4c6cb",
                        "background": "#0b1326",
                        "outline": "#8e9195",
                        "surface-container-highest": "#2d3449",
                        "error-container": "#93000a",
                        "on-background": "#dae2fd",
                        "primary": "#e7f1fe",
                        "surface": "#0b1326",
                        "on-tertiary": "#3e2d22",
                        "on-tertiary-fixed-variant": "#564337",
                        "secondary-fixed": "#d3e4fe",
                        "primary-container": "#cbd5e1",
                        "inverse-surface": "#dae2fd",
                        "tertiary": "#ffece3",
                        "surface-dim": "#0b1326",
                        "error": "#ffb4ab",
                        "inverse-primary": "#565f6a",
                        "on-secondary-container": "#a9bad3",
                        "on-secondary-fixed": "#0b1c30",
                        "primary-fixed": "#dae3f0",
                        "tertiary-fixed": "#faddcc",
                        "on-primary-fixed-variant": "#3e4852",
                        "surface-container-high": "#222a3d",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-secondary": "#213145",
                        "surface-variant": "#2d3449",
                        "on-primary-fixed": "#131d25",
                        "tertiary-container": "#ebcebe",
                        "on-error": "#690005",
                        "on-tertiary-fixed": "#27180e",
                        "inverse-on-surface": "#283044",
                        "tertiary-fixed-dim": "#ddc1b1",
                        "on-error-container": "#ffdad6",
                        "secondary": "#b7c8e1",
                        "secondary-container": "#3a4a5f",
                        "on-tertiary-container": "#6c574a",
                        "surface-bright": "#31394d",
                        "surface-container-low": "#131b2e",
                        "surface-container": "#171f33",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-primary-container": "#525c66"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "base": "4px",
                        "sm": "8px",
                        "xl": "40px",
                        "gutter": "20px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "margin-desktop": "64px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Outfit"],
                        "headline-md": ["Outfit"],
                        "headline-lg-mobile": ["Outfit"],
                        "body-lg": ["Outfit"],
                        "headline-lg": ["Outfit"],
                        "label-md": ["Outfit"],
                        "label-sm": ["Outfit"],
                        "display-lg": ["Outfit"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .glass-card {
            background-color: rgba(45, 52, 73, 0.7); /* surface-container-highest */
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-btn {
            box-shadow: 0 0 20px rgba(189, 200, 211, 0.3); /* primary-fixed-dim */
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-surface/70 dark:bg-surface/70 backdrop-blur-xl border-b border-white/10 shadow-2xl flex justify-between items-center px-gutter h-16 z-50">
<div class="flex items-center gap-sm cursor-pointer hover:opacity-90 transition-opacity scale-95 transition-transform text-primary dark:text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">graphic_eq</span>
<span class="font-headline-md text-headline-md tracking-widest text-primary-fixed-dim dark:text-primary-fixed-dim">VOCALIZE</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container overflow-hidden flex items-center justify-center border border-white/10">
<span class="material-symbols-outlined text-sm">person</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[104px] pb-[104px] px-margin-mobile md:px-margin-desktop flex flex-col items-center justify-center relative">
<!-- Abstract Background Element -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary-fixed-dim/5 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Central Player Card -->
<article class="glass-card w-full max-w-md rounded-3xl p-xl flex flex-col items-center text-center relative z-10">
<span class="text-on-surface-variant font-label-md text-label-md uppercase tracking-wider mb-sm">Track 4 of 12</span>
<!-- Target Word -->
<h1 class="font-display-lg text-display-lg text-on-surface mb-base mt-md">Sophisticated</h1>
<!-- Phonetic Guide -->
<p class="font-body-lg text-body-lg text-outline-variant mb-lg font-mono">/səˈfɪstɪkeɪtɪd/</p>
<!-- Hidden Translation Hint -->
<div class="group relative cursor-pointer mb-xl">
<div class="absolute inset-0 bg-surface-variant rounded-lg blur-sm group-hover:blur-md transition-all"></div>
<div class="relative px-lg py-sm border border-outline/30 rounded-lg bg-surface-container/50">
<span class="font-label-md text-label-md text-on-surface-variant group-hover:opacity-0 transition-opacity duration-300">Tap to reveal translation</span>
<span class="font-body-md text-body-md text-primary absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">Raffiné / Complexe</span>
</div>
</div>
<!-- Waveform Placeholder -->
<div class="w-full h-12 flex items-center justify-center gap-1 mb-xl opacity-70">
<div class="w-1 h-3 bg-primary-fixed-dim rounded-full"></div>
<div class="w-1 h-6 bg-primary-fixed-dim rounded-full"></div>
<div class="w-1 h-10 bg-primary-fixed-dim rounded-full"></div>
<div class="w-1 h-4 bg-primary-fixed-dim rounded-full"></div>
<div class="w-1 h-8 bg-primary-fixed-dim rounded-full"></div>
<div class="w-1 h-12 bg-primary-fixed-dim rounded-full"></div>
<div class="w-1 h-5 bg-outline-variant rounded-full"></div>
<div class="w-1 h-2 bg-outline-variant rounded-full"></div>
<div class="w-1 h-7 bg-outline-variant rounded-full"></div>
<div class="w-1 h-3 bg-outline-variant rounded-full"></div>
</div>
<!-- Playback Controls -->
<div class="flex items-center justify-center gap-lg w-full">
<button class="w-12 h-12 rounded-full border border-outline/30 flex items-center justify-center text-on-surface-variant hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined">skip_previous</span>
</button>
<button class="w-20 h-20 rounded-full bg-primary-fixed-dim text-surface-container-lowest flex items-center justify-center glow-btn hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-size: 40px; font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="w-12 h-12 rounded-full border border-outline/30 flex items-center justify-center text-on-surface-variant hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined">skip_next</span>
</button>
</div>
<div class="w-full flex justify-between mt-md font-label-sm text-label-sm text-outline-variant">
<span>0:42</span>
<span>-1:18</span>
</div>
</article>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 w-full z-50 bg-surface-container/70 dark:bg-surface-container/70 backdrop-blur-2xl border-t border-white/10 shadow-[0_-10px_30px_rgba(0,0,0,0.4)] flex justify-around items-center h-20 px-4 pb-2">
<a class="flex flex-col items-center justify-center text-outline-variant hover:bg-white/5 active:scale-90 transition-all p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">library_music</span>
<span class="font-label-sm text-label-sm">Library</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-xl px-4 py-1 active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">mic</span>
<span class="font-label-sm text-label-sm">Record</span>
</a>
<a class="flex flex-col items-center justify-center text-outline-variant hover:bg-white/5 active:scale-90 transition-all p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">cloud_upload</span>
<span class="font-label-sm text-label-sm">Upload</span>
</a>
<a class="flex flex-col items-center justify-center text-outline-variant hover:bg-white/5 active:scale-90 transition-all p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>
</nav>
</body></html>

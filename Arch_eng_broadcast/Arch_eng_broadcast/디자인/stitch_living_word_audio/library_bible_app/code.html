<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Library &amp; Search</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&amp;family=Inter:wght@400;500;600&amp;family=Literata:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "tertiary-fixed-dim": "#bcc7de",
                    "on-primary-fixed": "#3a0b00",
                    "secondary-fixed-dim": "#ffb68e",
                    "surface-container-highest": "#e5e2dd",
                    "on-background": "#1c1c19",
                    "on-tertiary-fixed-variant": "#3c475a",
                    "on-tertiary-fixed": "#111c2d",
                    "primary-container": "#7c2d12",
                    "primary": "#5e1700",
                    "inverse-surface": "#31302d",
                    "error-container": "#ffdad6",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#7c2d12",
                    "secondary-container": "#fd8a42",
                    "secondary": "#9b4500",
                    "secondary-fixed": "#ffdbca",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#263143",
                    "primary-fixed": "#ffdbd0",
                    "surface-dim": "#dcdad5",
                    "on-error-container": "#93000a",
                    "outline-variant": "#dcc1b9",
                    "on-primary-container": "#ff9b7b",
                    "inverse-primary": "#ffb59e",
                    "tertiary-fixed": "#d8e3fb",
                    "surface-container-high": "#ebe8e3",
                    "inverse-on-surface": "#f3f0eb",
                    "error": "#ba1a1a",
                    "primary-fixed-dim": "#ffb59e",
                    "on-surface": "#1c1c19",
                    "surface-bright": "#fcf9f4",
                    "tertiary-container": "#3c475a",
                    "on-secondary-fixed": "#331200",
                    "on-secondary-fixed-variant": "#763300",
                    "on-tertiary-container": "#aab5cc",
                    "surface": "#fcf9f4",
                    "surface-tint": "#9b4427",
                    "outline": "#89726c",
                    "on-primary": "#ffffff",
                    "background": "#fcf9f4",
                    "on-surface-variant": "#55423d",
                    "on-secondary-container": "#682c00",
                    "surface-container-low": "#f6f3ee",
                    "surface-container": "#f0ede8",
                    "surface-variant": "#e5e2dd"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-mobile": "20px",
                    "stack-gap": "24px",
                    "margin-desktop": "120px",
                    "gutter": "16px",
                    "reading-max-width": "680px"
            },
            "fontFamily": {
                    "headline-lg": ["EB Garamond"],
                    "display-lg": ["EB Garamond"],
                    "verse-number": ["Inter"],
                    "headline-lg-mobile": ["EB Garamond"],
                    "reading-body-mobile": ["Literata"],
                    "reading-body": ["Literata"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "verse-number": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "600"}],
                    "reading-body-mobile": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "reading-body": ["20px", {"lineHeight": "32px", "fontWeight": "400"}],
                    "label-sm": ["13px", {"lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-background text-on-background antialiased min-h-screen pb-[100px]">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim docked full-width top-0 border-b border-outline-variant flat no shadows flex justify-between items-center px-margin-mobile h-16 w-full z-40 sticky">
<button aria-label="menu" class="p-2 hover:bg-surface-container-high transition-colors rounded-full text-primary dark:text-primary-fixed">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">Scripture</h1>
<button aria-label="settings" class="p-2 hover:bg-surface-container-high transition-colors rounded-full text-primary dark:text-primary-fixed">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<main class="max-w-[reading-max-width] mx-auto px-margin-mobile md:px-margin-desktop py-stack-gap">
<!-- Search Section -->
<div class="mb-stack-gap">
<div class="relative w-full border-b border-outline-variant hover:border-primary focus-within:border-primary transition-colors pb-2 flex items-center">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="search">search</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-reading-body-mobile font-reading-body-mobile text-on-surface placeholder:text-on-surface-variant p-0 outline-none" placeholder="Search Bible" type="text"/>
</div>
</div>
<!-- Tabbed View -->
<div class="flex space-x-gutter mb-stack-gap overflow-x-auto pb-2 scrollbar-hide border-b border-outline-variant/30">
<button class="pb-2 border-b-2 border-primary text-primary font-label-sm text-label-sm px-2 whitespace-nowrap">Recent</button>
<button class="pb-2 border-b-2 border-transparent text-on-surface-variant hover:text-primary font-label-sm text-label-sm px-2 whitespace-nowrap">Bookmarks</button>
<button class="pb-2 border-b-2 border-transparent text-on-surface-variant hover:text-primary font-label-sm text-label-sm px-2 whitespace-nowrap">Downloads</button>
</div>
<!-- Book List Section -->
<div class="space-y-stack-gap">
<!-- Old Testament -->
<section>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface-variant mb-4">Old Testament</h2>
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant/50 divide-y divide-outline-variant/30">
<div class="p-4 hover:bg-surface-container-low transition-colors cursor-pointer flex justify-between items-center group">
<span class="font-reading-body-mobile text-reading-body-mobile group-hover:text-primary transition-colors">Genesis</span>
<span class="material-symbols-outlined text-on-surface-variant/50 group-hover:text-primary/70" data-icon="chevron_right">chevron_right</span>
</div>
<div class="p-4 hover:bg-surface-container-low transition-colors cursor-pointer flex justify-between items-center group">
<span class="font-reading-body-mobile text-reading-body-mobile group-hover:text-primary transition-colors">Exodus</span>
<span class="material-symbols-outlined text-on-surface-variant/50 group-hover:text-primary/70" data-icon="chevron_right">chevron_right</span>
</div>
<div class="p-4 hover:bg-surface-container-low transition-colors cursor-pointer flex justify-between items-center group">
<span class="font-reading-body-mobile text-reading-body-mobile group-hover:text-primary transition-colors">Leviticus</span>
<span class="material-symbols-outlined text-on-surface-variant/50 group-hover:text-primary/70" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</section>
<!-- New Testament -->
<section>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface-variant mb-4">New Testament</h2>
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant/50 divide-y divide-outline-variant/30">
<div class="p-4 hover:bg-surface-container-low transition-colors cursor-pointer flex justify-between items-center group">
<span class="font-reading-body-mobile text-reading-body-mobile group-hover:text-primary transition-colors">Matthew</span>
<span class="material-symbols-outlined text-on-surface-variant/50 group-hover:text-primary/70" data-icon="chevron_right">chevron_right</span>
</div>
<div class="p-4 hover:bg-surface-container-low transition-colors cursor-pointer flex justify-between items-center group">
<span class="font-reading-body-mobile text-reading-body-mobile group-hover:text-primary transition-colors">Mark</span>
<span class="material-symbols-outlined text-on-surface-variant/50 group-hover:text-primary/70" data-icon="chevron_right">chevron_right</span>
</div>
<div class="p-4 hover:bg-surface-container-low transition-colors cursor-pointer flex justify-between items-center group">
<span class="font-reading-body-mobile text-reading-body-mobile group-hover:text-primary transition-colors">Luke</span>
<span class="material-symbols-outlined text-on-surface-variant/50 group-hover:text-primary/70" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</section>
</div>
</main>
<!-- BottomNavBar (Mobile only) -->
<nav class="md:hidden bg-surface/90 dark:bg-surface-dim/90 backdrop-blur-md text-secondary dark:text-secondary-fixed font-label-sm text-label-sm font-headline-lg text-headline-lg text-primary docked full-width bottom-0 rounded-t-full border-t border-outline-variant shadow-sm dark:shadow-none fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2">
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span>Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="book_2">book_2</span>
<span>Bible</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="play_circle">play_circle</span>
<span>Audio</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-semibold hover:text-primary transition-all active:scale-110 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="library_books" data-weight="fill" style="font-variation-settings: 'FILL' 1;">library_books</span>
<span>Library</span>
</a>
</nav>
<style>
        /* Minimal custom styling for scrollbar hiding in tabs */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body></html>

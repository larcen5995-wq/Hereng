<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Audio Bible Player Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600&amp;family=Literata:wght@400&amp;family=Inter:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "tertiary-fixed-dim": "#bcc7de",
                    "on-primary-fixed": "#3a0b00",
                    "secondary-fixed-dim": "#ffb68e",
                    "surface-container-highest": "#e5e2dd",
                    "on-background": "#1c1c19",
                    "on-tertiary-fixed-variant": "#3c475a",
                    "on-tertiary-fixed": "#111c2d",
                    "primary-container": "#7c2d12",
                    "primary": "#5e1700",
                    "inverse-surface": "#31302d",
                    "error-container": "#ffdad6",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#7c2d12",
                    "secondary-container": "#fd8a42",
                    "secondary": "#9b4500",
                    "secondary-fixed": "#ffdbca",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#263143",
                    "primary-fixed": "#ffdbd0",
                    "surface-dim": "#dcdad5",
                    "on-error-container": "#93000a",
                    "outline-variant": "#dcc1b9",
                    "on-primary-container": "#ff9b7b",
                    "inverse-primary": "#ffb59e",
                    "tertiary-fixed": "#d8e3fb",
                    "surface-container-high": "#ebe8e3",
                    "inverse-on-surface": "#f3f0eb",
                    "error": "#ba1a1a",
                    "primary-fixed-dim": "#ffb59e",
                    "on-surface": "#1c1c19",
                    "surface-bright": "#fcf9f4",
                    "tertiary-container": "#3c475a",
                    "on-secondary-fixed": "#331200",
                    "on-secondary-fixed-variant": "#763300",
                    "on-tertiary-container": "#aab5cc",
                    "surface": "#fcf9f4",
                    "surface-tint": "#9b4427",
                    "outline": "#89726c",
                    "on-primary": "#ffffff",
                    "background": "#fcf9f4",
                    "on-surface-variant": "#55423d",
                    "on-secondary-container": "#682c00",
                    "surface-container-low": "#f6f3ee",
                    "surface-container": "#f0ede8",
                    "surface-variant": "#e5e2dd"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-mobile": "20px",
                    "stack-gap": "24px",
                    "margin-desktop": "120px",
                    "gutter": "16px",
                    "reading-max-width": "680px"
            },
            "fontFamily": {
                    "headline-lg": [
                            "EB Garamond"
                    ],
                    "display-lg": [
                            "EB Garamond"
                    ],
                    "verse-number": [
                            "Inter"
                    ],
                    "headline-lg-mobile": [
                            "EB Garamond"
                    ],
                    "reading-body-mobile": [
                            "Literata"
                    ],
                    "reading-body": [
                            "Literata"
                    ],
                    "label-sm": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "fontWeight": "600"
                            }
                    ],
                    "display-lg": [
                            "48px",
                            {
                                    "lineHeight": "56px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "600"
                            }
                    ],
                    "verse-number": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "600"
                            }
                    ],
                    "headline-lg-mobile": [
                            "28px",
                            {
                                    "lineHeight": "34px",
                                    "fontWeight": "600"
                            }
                    ],
                    "reading-body-mobile": [
                            "18px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "400"
                            }
                    ],
                    "reading-body": [
                            "20px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "400"
                            }
                    ],
                    "label-sm": [
                            "13px",
                            {
                                    "lineHeight": "18px",
                                    "letterSpacing": "0.02em",
                                    "fontWeight": "500"
                            }
                    ]
            }
    },
        },
      }
    </script>
</head>
<body class="bg-background text-on-background font-reading-body-mobile md:font-reading-body flex flex-col h-screen overflow-hidden antialiased">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full z-40 bg-surface dark:bg-surface-dim border-b border-outline-variant flat no shadows relative">
<button class="p-2 text-primary dark:text-primary-fixed hover:bg-surface-container-high transition-colors Active: scale-95 duration-150 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary dark:text-primary-fixed font-bold">Scripture</h1>
<button class="p-2 text-primary dark:text-primary-fixed hover:bg-surface-container-high transition-colors Active: scale-95 duration-150 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 relative w-full h-full">
<!-- Background Image -->
<div class="absolute inset-0 bg-cover bg-center bg-no-repeat w-full h-full z-0" data-alt="A serene, ethereal landscape featuring a calm mountain lake at dawn. Soft, warm sunlight is breaking through the morning mist, casting a gentle golden glow across the water. The scene is deeply peaceful and sacred, utilizing a classic, sophisticated aesthetic with muted earth tones and subtle lighting to convey reverence and stillness. The composition is expansive and minimalist, ideal for contemplative audio listening." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDacV-a4UB7nO-vB-6nMX_CRRaAHPFfqsXWCLGZjCrQpMLLg1P_SJJWM2a6HxCs1hfO4WphDDbTIxMhD7u0nId2AWEaOvzt0vkuCsNNKDZ68HY8b8GfU36oh9WTyBrUhnxKn0ZqE8XBjsF4IoJtz6u00kylm8u1GvcSWzCVkI0cP-OygneOXUFQ7LeaEbYtG-mY7O2Jt4E_RNMIX8hAqTt6FykahYDk9kDCOMOvdZ4W4LiI0sf_ZF6-')"></div>
<!-- Subtle Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-highest via-transparent to-surface-container/30 z-0 mix-blend-multiply"></div>
<!-- Player Controls Container -->
<div class="absolute bottom-0 left-0 w-full p-6 md:p-10 pb-28 md:pb-32 flex flex-col items-center z-10 bg-gradient-to-t from-surface via-surface/90 to-transparent">
<!-- Track Info -->
<div class="text-center mb-8 max-w-md w-full">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2 tracking-tight">Psalms 23</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant/80 uppercase tracking-widest">The Lord is My Shepherd</p>
</div>
<!-- Progress Bar -->
<div class="w-full max-w-md mb-8 px-4">
<div class="relative w-full h-1 bg-outline-variant/30 rounded-full overflow-hidden cursor-pointer">
<div class="absolute top-0 left-0 h-full bg-secondary w-1/3 rounded-full"></div>
</div>
<div class="flex justify-between mt-3 font-verse-number text-verse-number text-on-surface-variant">
<span>1:24</span>
<span>3:45</span>
</div>
</div>
<!-- Main Controls -->
<div class="flex items-center justify-center gap-stack-gap mb-8">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-3 rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-[28px]">export_notes</span>
</button>
<button class="w-20 h-20 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg shadow-primary/20 hover:scale-105 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[40px] ml-1" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-3 rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-[28px]">apps</span>
</button>
</div>
<!-- Secondary Controls -->
<div class="flex items-center justify-between w-full max-w-sm px-6 font-label-sm text-label-sm text-on-surface-variant">
<button class="flex flex-col items-center gap-1 hover:text-primary transition-colors p-2 rounded-lg hover:bg-surface-variant/30">
<span class="material-symbols-outlined text-[20px]">speed</span>
<span>1.0x</span>
</button>
<button class="flex flex-col items-center gap-1 hover:text-primary transition-colors p-2 rounded-lg hover:bg-surface-variant/30">
<span class="material-symbols-outlined text-[20px]">snooze</span>
<span>Timer</span>
</button>
<button class="flex flex-col items-center gap-1 hover:text-primary transition-colors p-2 rounded-lg hover:bg-surface-variant/30">
<span class="material-symbols-outlined text-[20px]">share</span>
<span>Share</span>
</button>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Mobile) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface/90 dark:bg-surface-dim/90 backdrop-blur-md rounded-t-full border-t border-outline-variant shadow-sm dark:shadow-none">
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-all Active: scale-110 duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-all Active: scale-110 duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">book_2</span>
<span class="font-label-sm text-label-sm">Bible</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-semibold hover:text-primary transition-all Active: scale-110 duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span class="font-label-sm text-label-sm">Audio</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-all Active: scale-110 duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">library_books</span>
<span class="font-label-sm text-label-sm">Library</span>
</a>
</nav>
</body></html>

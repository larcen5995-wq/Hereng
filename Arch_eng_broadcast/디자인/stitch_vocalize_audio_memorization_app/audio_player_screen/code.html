<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vocalize - Audio Memorization Player</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Outfit:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "surface-container-high": "#272a34",
                        "error": "#ffb4ab",
                        "surface-container-lowest": "#0b0e17",
                        "surface-bright": "#363943",
                        "primary": "#c0c1ff",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#001f26",
                        "outline-variant": "#464554",
                        "surface": "#10131c",
                        "on-tertiary-container": "#400071",
                        "on-background": "#e0e2ef",
                        "tertiary-fixed": "#f0dbff",
                        "tertiary-container": "#b76dff",
                        "outline": "#908fa0",
                        "tertiary-fixed-dim": "#ddb7ff",
                        "inverse-surface": "#e0e2ef",
                        "surface-dim": "#10131c",
                        "secondary-fixed-dim": "#4cd7f6",
                        "on-secondary-container": "#00424e",
                        "error-container": "#93000a",
                        "surface-container-highest": "#32343f",
                        "primary-container": "#8083ff",
                        "on-surface": "#e0e2ef",
                        "on-secondary": "#003640",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "tertiary": "#ddb7ff",
                        "primary-fixed": "#e1e0ff",
                        "on-secondary-fixed-variant": "#004e5c",
                        "surface-tint": "#c0c1ff",
                        "on-surface-variant": "#c7c4d7",
                        "on-primary-fixed": "#07006c",
                        "inverse-primary": "#494bd6",
                        "on-tertiary-fixed-variant": "#6900b3",
                        "on-primary-container": "#0d0096",
                        "on-tertiary-fixed": "#2c0051",
                        "secondary-container": "#03b5d3",
                        "on-primary": "#1000a9",
                        "surface-variant": "#32343f",
                        "background": "#10131c",
                        "surface-container": "#1c1f29",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-tertiary": "#490080",
                        "surface-container-low": "#181b25",
                        "secondary": "#4cd7f6",
                        "secondary-fixed": "#acedff",
                        "inverse-on-surface": "#2d303a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target": "48px",
                        "gutter": "16px",
                        "container-margin": "24px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "mono-label": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "display-lg-mobile": ["Outfit"],
                        "display-lg": ["Outfit"],
                        "headline-md": ["Outfit"]
                    },
                    "fontSize": {
                        "mono-label": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],

                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(192, 193, 255, 0.2);
        }
        .text-neon {
            text-shadow: 0 0 10px rgba(192, 193, 255, 0.5);
        }
        
        /* Visualizer Animation */
        @keyframes pulse-bar {
            0% { height: 10%; }
            50% { height: 100%; }
            100% { height: 10%; }
        }
        .vis-bar {
            animation: pulse-bar 1s infinite alternate;
        }
        .vis-bar:nth-child(1) { animation-delay: 0.1s; animation-duration: 0.8s; }
        .vis-bar:nth-child(2) { animation-delay: 0.3s; animation-duration: 1.2s; }
        .vis-bar:nth-child(3) { animation-delay: 0.0s; animation-duration: 0.9s; }
        .vis-bar:nth-child(4) { animation-delay: 0.2s; animation-duration: 1.1s; }
        .vis-bar:nth-child(5) { animation-delay: 0.4s; animation-duration: 0.7s; }
        .vis-bar:nth-child(6) { animation-delay: 0.1s; animation-duration: 1.0s; }
        .vis-bar:nth-child(7) { animation-delay: 0.5s; animation-duration: 1.3s; }

        /* Play Button Pulse */
        @keyframes play-pulse {
            0% { box-shadow: 0 0 0 0 rgba(192, 193, 255, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(192, 193, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(192, 193, 255, 0); }
        }
        .play-btn {
            animation: play-pulse 2s infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex flex-col font-body-md">
<!-- Shader Background -->

<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-margin h-touch-target bg-transparent backdrop-blur-xl border-b border-white/10 shadow-[0_0_20px_rgba(192,193,255,0.1)]">
<div class="flex items-center gap-unit">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: 'FILL' 0;">menu</span>
</div>
<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md tracking-tighter text-primary uppercase">VOCALIZE</h1>
<div class="flex items-center gap-unit">
<span class="font-mono-label text-mono-label text-on-surface-variant">EN</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col pt-[calc(var(--spacing-touch-target)+var(--spacing-container-margin))] pb-[120px] px-gutter relative z-10 z-10 max-w-3xl mx-auto w-full">
<!-- Filter Tabs -->
<div class="flex overflow-x-auto no-scrollbar gap-unit mb-container-margin py-unit">
<button class="px-4 py-2 rounded-full border border-secondary text-secondary bg-secondary/10 font-label-caps text-label-caps whitespace-nowrap shadow-[0_0_10px_rgba(76,215,246,0.2)]">TOEIC</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant glass-panel font-label-caps text-label-caps whitespace-nowrap">HIGH</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant glass-panel font-label-caps text-label-caps whitespace-nowrap">BASIC</button>
<div class="w-px h-6 bg-outline-variant mx-1 self-center"></div>
<button class="px-4 py-2 rounded-full border border-secondary text-secondary bg-secondary/10 font-label-caps text-label-caps whitespace-nowrap shadow-[0_0_10px_rgba(76,215,246,0.2)]">WORDS</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant glass-panel font-label-caps text-label-caps whitespace-nowrap">IDIOMS</button>
</div>
<!-- Central Flashcard (Bento Grid approach) -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-unit mb-auto flex-1 min-h-[300px]">
<div class="md:col-span-12 glass-panel rounded-xl p-8 flex flex-col justify-center items-center relative border-l border-t border-white/20 neon-glow">
<div class="absolute top-4 right-4 flex items-center gap-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">REVEAL</span>
<button class="w-10 h-6 bg-surface-container-high rounded-full relative p-1 transition-colors glass-panel border-outline-variant">
<div class="w-4 h-4 bg-outline rounded-full transform translate-x-0 transition-transform"></div>
</button>
</div>
<div class="text-center space-y-4">
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-background text-neon">Apple</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant tracking-wide">[애플]</p>
<div class="mt-8 pt-8 border-t border-white/10 w-48 mx-auto">
<p class="font-headline-md text-headline-md-mobile md:text-headline-md text-secondary filter blur-[6px] transition-all duration-300 hover:blur-none cursor-pointer">사과</p>
</div>
</div>
<!-- Voice Visualizer -->
<div class="absolute bottom-6 w-full flex justify-center items-end gap-1 h-12 px-8">
<div class="w-2 bg-primary rounded-t-sm vis-bar opacity-80 shadow-[0_0_8px_rgba(192,193,255,0.6)]"></div>
<div class="w-2 bg-secondary rounded-t-sm vis-bar opacity-80 shadow-[0_0_8px_rgba(76,215,246,0.6)]"></div>
<div class="w-2 bg-primary rounded-t-sm vis-bar opacity-80 shadow-[0_0_8px_rgba(192,193,255,0.6)]"></div>
<div class="w-2 bg-secondary rounded-t-sm vis-bar opacity-80 shadow-[0_0_8px_rgba(76,215,246,0.6)]"></div>
<div class="w-2 bg-primary rounded-t-sm vis-bar opacity-80 shadow-[0_0_8px_rgba(192,193,255,0.6)]"></div>
<div class="w-2 bg-secondary rounded-t-sm vis-bar opacity-80 shadow-[0_0_8px_rgba(76,215,246,0.6)]"></div>
<div class="w-2 bg-primary rounded-t-sm vis-bar opacity-80 shadow-[0_0_8px_rgba(192,193,255,0.6)]"></div>
</div>
</div>
</div>
<!-- The Playback Zone (Bottom Third Content) -->
<div class="mt-8 space-y-6">
<!-- Settings Bar -->
<div class="flex justify-between items-center bg-surface-container-low/50 backdrop-blur-md rounded-lg p-2 border border-white/5">
<button class="flex items-center gap-1 px-3 py-1.5 rounded-md hover:bg-surface-container-high transition-colors text-on-surface-variant font-mono-label text-mono-label">
<span class="material-symbols-outlined text-[16px]">timer</span> 1.5s
                </button>
<button class="flex items-center gap-1 px-3 py-1.5 rounded-md hover:bg-surface-container-high transition-colors text-on-surface-variant font-mono-label text-mono-label">
<span class="material-symbols-outlined text-[16px]">repeat_one</span> 1x
                </button>
<button class="flex items-center gap-1 px-3 py-1.5 rounded-md hover:bg-surface-container-high transition-colors text-on-surface-variant font-mono-label text-mono-label">
<span class="material-symbols-outlined text-[16px]">speed</span> 1.0x
                </button>
<button class="flex items-center gap-1 px-3 py-1.5 rounded-md hover:bg-surface-container-high transition-colors text-on-surface-variant font-mono-label text-mono-label">
<span class="material-symbols-outlined text-[16px]">record_voice_over</span> M
                </button>
</div>
<!-- Player Controls -->
<div class="flex justify-center items-center gap-8">
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
<div class="flex items-center gap-6">
<button class="w-14 h-14 rounded-full flex items-center justify-center text-on-background hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">skip_previous</span>
</button>
<button class="w-24 h-24 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-[0_0_30px_rgba(192,193,255,0.4)] play-btn">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-14 h-14 rounded-full flex items-center justify-center text-on-background hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
</div>
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">bookmark</span>
</button>
</div>
<!-- Progress Bar -->
<div class="w-full flex items-center gap-4">
<span class="font-mono-label text-mono-label text-on-surface-variant">0:12</span>
<div class="flex-1 h-1 bg-surface-container-high rounded-full overflow-hidden relative">
<div class="absolute left-0 top-0 h-full bg-secondary shadow-[0_0_8px_rgba(76,215,246,0.8)]" style="width: 35%;"></div>
<div class="absolute w-3 h-3 bg-primary rounded-full top-1/2 -translate-y-1/2 -ml-1.5" style="left: 35%; box-shadow: 0 0 10px rgba(192,193,255,0.8);"></div>
</div>
<span class="font-mono-label text-mono-label text-on-surface-variant">-2:45</span>
</div>
</div>
</main>
<!-- Ad Banner -->
<div class="fixed bottom-[80px] w-full px-gutter z-40 pb-2">
<div class="bg-surface-container-highest/80 backdrop-blur-md rounded-lg p-3 flex items-center justify-between border-l-4 border-[#FFD700] shadow-lg">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#FFD700] text-[20px]">radio</span>
<span class="font-mono-label text-mono-label text-on-background">1-Hour Radio Ad Timer</span>
</div>
<span class="font-mono-label text-mono-label text-[#FFD700]">60:00</span>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 pb-safe px-gutter bg-surface-container/30 backdrop-blur-2xl rounded-t-xl border-t border-white/10 shadow-[0_-4px_24px_rgba(0,0,0,0.5)] md:hidden">
<a class="flex flex-col items-center justify-center text-primary drop-shadow-[0_0_8px_rgba(192,193,255,0.6)] scale-110 transition-transform duration-300" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span class="font-label-caps text-label-caps">Player</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-secondary transition-colors" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">cloud_upload</span>
<span class="font-label-caps text-label-caps">Upload</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-secondary transition-colors" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">workspace_premium</span>
<span class="font-label-caps text-label-caps">Pro</span>
</a>
</nav>
</body></html>

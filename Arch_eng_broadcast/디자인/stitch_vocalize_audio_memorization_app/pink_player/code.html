<style>
        body {
            background-color: #0f0714; /* Deep dark base for vaporwave */
            background-image: radial-gradient(circle at 50% 0%, #311132 0%, transparent 70%);
        }

        /* Equalizer Animation */
        @keyframes eq-bounce {
            0%, 100% { height: 10%; }
            50% { height: 90%; }
        }
        .eq-bar {
            animation: eq-bounce 1s infinite ease-in-out alternate;
        }
        .eq-bar:nth-child(1) { animation-delay: 0.1s; animation-duration: 0.8s; }
        .eq-bar:nth-child(2) { animation-delay: 0.3s; animation-duration: 1.1s; }
        .eq-bar:nth-child(3) { animation-delay: 0.0s; animation-duration: 0.7s; }
        .eq-bar:nth-child(4) { animation-delay: 0.5s; animation-duration: 1.2s; }
        .eq-bar:nth-child(5) { animation-delay: 0.2s; animation-duration: 0.9s; }
        .eq-bar:nth-child(6) { animation-delay: 0.4s; animation-duration: 1.0s; }
        .eq-bar:nth-child(7) { animation-delay: 0.1s; animation-duration: 0.8s; }

        /* Custom glow utilities */
        .glow-pink-strong {
            box-shadow: 0 0 30px rgba(247, 81, 161, 0.6), 0 0 10px rgba(255, 176, 205, 0.4);
        }
        .text-glow-pink {
            text-shadow: 0 0 15px rgba(255, 176, 205, 0.8);
